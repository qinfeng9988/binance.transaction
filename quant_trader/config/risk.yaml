# Risk Management Configuration
# Supports hot-reload (changes detected and applied without restart)

# Leverage limits by coin category
leverage_limits:
  major_coins: 5      # BTC, ETH, SOL
  alt_coins: 3        # Everything else

# Major coin symbols (used for leverage limit classification)
major_symbols:
  - "BTC"
  - "ETH"
  - "SOL"

# Stop loss settings (percentage of position value)
stop_loss:
  default_pct: 1.5
  min_pct: 1.0
  max_pct: 2.5

# Position risk limits (percentage of margin/account balance)
position_limits:
  # Maximum loss per trade as percentage of margin
  max_loss_per_trade_pct: 15
  # Maximum daily cumulative loss as percentage of margin
  max_daily_loss_pct: 30
  # Maximum position size as percentage of total balance (per symbol)
  max_position_size_pct: 40
  # Maximum number of concurrent positions
  max_concurrent_positions: 5

# Automatic leverage reduction
# When stop_loss_pct * leverage > max_leveraged_loss_pct, reduce leverage
max_leveraged_loss_pct: 15
